<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Importar prova – Gabarito</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <div class="topo-in">
      <a class="marca" href="./" aria-label="Gabarito, início">
        <span class="marca-bolha" aria-hidden="true"></span>
        <span class="marca-nome">Gabarito</span>
      </a>
      <nav class="abas" aria-label="Seções">
        <a class="aba" href="./">Praticar</a>
        <a class="aba" href="importar.html" aria-current="page">Importar prova</a>
      </nav>
    </div>
  </header>

  <main class="miolo imp" id="imp">
    <h1 class="titulo-pagina">Importar prova em PDF</h1>
    <p class="apoio">O PDF é lido aqui no seu navegador. As questões são separadas, classificadas por área e tema, e você revisa tudo antes de enviar ao banco.</p>

    <section class="secao" aria-labelledby="h-arquivos">
      <h2 id="h-arquivos">Arquivos</h2>
      <div class="filtros">
        <label class="campo">
          <span>Prova (PDF com texto selecionável)</span>
          <input type="file" id="f-prova" accept="application/pdf,.pdf">
        </label>
        <label class="campo">
          <span>Gabarito em PDF (opcional, se estiver em arquivo separado)</span>
          <input type="file" id="f-gab" accept="application/pdf,.pdf">
        </label>
        <div class="linha-filtro">
          <label class="campo"><span>Banca</span><input type="text" id="m-banca" maxlength="40"></label>
          <label class="campo"><span>Órgão / cargo</span><input type="text" id="m-orgao" maxlength="80"></label>
          <label class="campo"><span>Ano</span><input type="text" id="m-ano" maxlength="4" inputmode="numeric"></label>
        </div>
        <div class="acoes-q">
          <button type="button" class="btn" id="btn-ler" disabled>Ler e separar questões</button>
          <span class="apoio" id="st-leitura" role="status" aria-live="polite"></span>
        </div>
      </div>
    </section>

    <section class="secao" id="sec-rev" hidden aria-labelledby="h-rev">
      <h2 id="h-rev">Revisão</h2>
      <p class="apoio" id="resumo-rev"></p>

      <details class="gab-box">
        <summary>Colar ou corrigir o gabarito</summary>
        <label class="campo">
          <span>Cole no formato 1-A 2-B 3-C… (aceita também 1 A, 1: A, 01) A)</span>
          <textarea id="t-gab" rows="4" placeholder="1-A 2-C 3-B 4-D"></textarea>
        </label>
        <button type="button" class="btn-sec" id="btn-gab">Aplicar gabarito</button>
      </details>

      <div class="barra-rev">
        <label class="chk"><input type="checkbox" id="so-revisar"> Mostrar só as que precisam de revisão</label>
        <span class="espaco"></span>
        <button type="button" class="btn-sec" id="btn-todas">Marcar todas as prontas</button>
        <button type="button" class="btn-sec" id="btn-nenhuma">Desmarcar todas</button>
      </div>

      <ol class="cards" id="cards"></ol>

      <div class="envio" id="envio">
        <div class="envio-in">
          <label class="campo chave" id="box-chave" hidden>
            <span>Chave de administrador</span>
            <input type="password" id="in-chave" autocomplete="off">
          </label>
          <span class="espaco"></span>
          <button type="button" class="btn-sec" id="btn-csv">Baixar CSV</button>
          <button type="button" class="btn" id="btn-enviar" disabled>Enviar para o banco</button>
        </div>
        <p class="apoio" id="st-envio" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <datalist id="dl-temas"></datalist>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="taxonomia.js"></script>
  <script src="parser.js"></script>
  <script src="importar.js"></script>
</body>
</html>
